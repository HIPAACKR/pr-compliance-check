name: 'Compliance Check'
description: 'Submits PR diff to a compliance API and posts the analysis as a PR comment.'
author: 'UbiComply'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  api-key:
    description: 'Compliance API key'
    required: true
  github-token:
    description: 'GitHub token for posting PR comments'
    required: true
    default: ${{ github.token }}
  frameworks:
    description: 'JSON array of compliance frameworks to map findings against, e.g. ["hipaa","cmmc"]. Omit for CWE-only output.'
    required: false
    default: ''
  poll-interval:
    description: 'Seconds between status polls'
    required: false
    default: '5'
  source-excludes:
    description: 'Extra tar exclude globs for the uploaded source archive, comma- or newline-separated (e.g. "public/images/*,docs/*"). Use when a repo trips the 100 MB server cap on assets the scanner does not need. Excluding paths hides them from your own compliance scan — exclude assets, not code.'
    required: false
    default: ''
  max-file-bytes:
    description: 'Any single tracked file larger than this is left out of the source archive (default 2 MB). Oversized files are not analyzable source — the common case is a Figma-exported .svg carrying a base64 raster. Raise it if your repo has legitimately large source files.'
    required: false
    default: '2097152'
  poll-timeout:
    description: 'Max seconds to wait for a result. Large or security-sensitive PRs run a deeper agentic sweep that can run well over an hour under shared-GPU contention. NOTE: the server job TTL (COMPLIANCE_PR_JOB_TTL_SECONDS, default 2h) must be >= this value, or a job running past the TTL returns job_not_found mid-poll instead of finishing.'
    required: false
    default: '10800'

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Generate diff and collect commit messages
      id: diff
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
        # Persist the merge-base so the submit step can send it as base_sha —
        # the server keys baseline lookup + delta on (repo_id, base_sha).
        echo "MERGE_BASE=$MERGE_BASE" >> "$GITHUB_ENV"
        git diff "$MERGE_BASE" "$HEAD_SHA" > /tmp/pr.diff

        DIFF_SIZE=$(wc -c < /tmp/pr.diff | tr -d " ")
        echo "Diff size: ${DIFF_SIZE} bytes"

        # Guard: skip analysis when the PR changes no substantive content.
        # An empty /tmp/pr.diff is the wrong test on its own — a whitespace-only
        # PR still produces a non-empty diff. Count changed lines with whitespace
        # and blank-line changes ignored instead. numstat prints "-" for binary
        # files, which always count as substantive; pure renames and mode changes
        # score 0 and are treated as metadata-only.
        CHANGED_LINES=$(git diff --ignore-all-space --ignore-blank-lines --numstat \
          "$MERGE_BASE" "$HEAD_SHA" \
          | awk -F'\t' '{ if ($1 == "-" || $2 == "-") { n += 1 } else { n += $1 + $2 } } END { print n + 0 }')
        echo "Substantive changed lines: ${CHANGED_LINES}"

        # Every later step is gated on this output. Exiting 0 here only ends this
        # step — without the gate the rest of the action runs on inputs that were
        # never produced and the check goes red instead of skipping cleanly.
        if [ "$CHANGED_LINES" -eq 0 ]; then
          echo "::notice::No substantive changes (whitespace-only, metadata-only, or net-empty PR) — skipping compliance analysis."
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "skip=false" >> "$GITHUB_OUTPUT"

        # Guard: fail if diff exceeds the 5 MB server-side cap
        if [ "$DIFF_SIZE" -gt 5242880 ]; then
          echo "::error::Diff size (${DIFF_SIZE} bytes) exceeds the 5 MB server limit. Please split the PR into smaller changes."
          exit 1
        fi

        # Collect subject + body per commit, NUL-delimited to safely handle newlines.
        # Each element in the JSON array is one full commit message (subject + blank line + body),
        # with trailing whitespace trimmed. Commits with no body produce subject-only strings.
        # Server caps at 20 entries in the prompt; rest are collapsed server-side.
        git log "$MERGE_BASE".."$HEAD_SHA" --format="%s%n%n%b%x00" | \
          awk 'BEGIN{RS="\0"} {gsub(/[[:space:]]+$/, ""); if (length > 0) print}' | \
          jq -R . | jq -s . > /tmp/commit_messages.json
        echo "Commit messages: $(cat /tmp/commit_messages.json)"

    - name: Package source for the agentic sweep
      if: steps.diff.outputs.skip != 'true'
      shell: bash
      env:
        SOURCE_EXCLUDES: ${{ inputs.source-excludes }}
        MAX_FILE_BYTES: ${{ inputs.max-file-bytes }}
      run: |
        # The agentic engine reads the actual code; upload the checked-out HEAD
        # so it can. FAST is deprecated: without this (and no configured codebase
        # reuse) the server returns BLOCKED, not a pass.
        #
        # The member list comes from git, not from the directory. tar has no
        # concept of .gitignore, so tarring the workspace archives whatever an
        # earlier workflow step happened to leave on disk (build output, caches,
        # fixtures). Tracked-only makes that whole class of bloat unreachable
        # instead of relying on an exclude list to enumerate it.
        cd "$GITHUB_WORKSPACE"

        # Members the scanner cannot read as source. Two independent rules,
        # because neither catches the other's case: compiled/packaged binaries
        # by extension (a vendored apktool.jar is 20 MB and gzip can't touch an
        # already-compressed archive), and a per-file size cap for oversized
        # text (Figma exports raster JPEGs base64-embedded inside .svg wrappers,
        # which routinely weigh 20 MB+ each and are not binary by extension).
        # .svg is deliberately NOT listed: an SVG can carry <script>, so small
        # ones stay in scope and only oversized ones fall to the size cap below.
        BIN_EXT='jar|war|ear|aar|apk|aab|ipa|dex|class|zip|7z|rar|gz|tgz|bz2|xz|zst|iso|dmg|exe|msi|dll|so|dylib|rlib|pyc|pyo|wasm|pdf|psd|ai|sketch|fig|eps|mp4|mov|avi|mkv|webm|mp3|wav|flac|ogg|ttf|otf|woff|woff2|eot|db|sqlite|sqlite3|mdb|dump|bin|pack|idx|node|whl|egg|jasper|png|jpg|jpeg|gif|webp|bmp|tif|tiff|ico|avif|heic'
        MAX_FILE_BYTES="${MAX_FILE_BYTES:-2097152}"

        # GNU stat on the runner; the BSD form keeps this runnable for local checks.
        if stat -c '%s' . >/dev/null 2>&1; then
          _size() { stat -c '%s' "$1"; }
        else
          _size() { stat -f '%z' "$1"; }
        fi

        : > /tmp/source_members.z
        : > /tmp/source_dropped.txt
        KEPT=0; DROPPED=0; DROPPED_BYTES=0
        while IFS= read -r -d '' f; do
          # Tracked-but-absent (submodule gitlinks, sparse checkouts) — skip quietly.
          if [ ! -f "$f" ] || [ -L "$f" ]; then
            continue
          fi
          EXT="${f##*.}"
          REASON=""
          if printf '%s' "$EXT" | grep -qiE "^(${BIN_EXT})$"; then
            REASON="binary type .${EXT}"
          else
            FSZ=$(_size "$f" 2>/dev/null || echo 0)
            if [ "$FSZ" -gt "$MAX_FILE_BYTES" ]; then
              REASON="${FSZ} bytes > per-file cap ${MAX_FILE_BYTES}"
            fi
          fi
          if [ -n "$REASON" ]; then
            FSZ=${FSZ:-$(_size "$f" 2>/dev/null || echo 0)}
            printf '%12s  %s  (%s)\n' "$FSZ" "$f" "$REASON" >> /tmp/source_dropped.txt
            DROPPED=$((DROPPED + 1)); DROPPED_BYTES=$((DROPPED_BYTES + FSZ))
            unset FSZ
            continue
          fi
          unset FSZ
          # Keep the ./ prefix so member names stay identical to previous releases.
          printf './%s\0' "$f" >> /tmp/source_members.z
          KEPT=$((KEPT + 1))
        done < <(git ls-files -z)

        # Consumer-supplied extra excludes, one glob per line or comma-separated.
        EXTRA_ARGS=()
        if [ -n "$SOURCE_EXCLUDES" ]; then
          # `|| [ -n "$pat" ]` so the final pattern survives the missing trailing
          # newline; trim only surrounding blanks, since a glob may contain spaces.
          while IFS= read -r pat || [ -n "$pat" ]; do
            pat="${pat#"${pat%%[![:space:]]*}"}"
            pat="${pat%"${pat##*[![:space:]]}"}"
            if [ -n "$pat" ]; then
              EXTRA_ARGS+=(--exclude="$pat")
              echo "Extra exclude: $pat"
            fi
          done < <(printf '%s' "$SOURCE_EXCLUDES" | tr ',' '\n')
        fi

        tar czf /tmp/source.tar.gz \
          --exclude='.git' --exclude='node_modules' --exclude='vendor' \
          --exclude='tmp' --exclude='log' --exclude='.bundle' --exclude='*.log' \
          "${EXTRA_ARGS[@]}" \
          --null -T /tmp/source_members.z

        SZ=$(wc -c < /tmp/source.tar.gz | tr -d ' ')
        echo "Packaged ${KEPT} tracked files; dropped ${DROPPED} unreadable-as-source (${DROPPED_BYTES} bytes)."
        echo "source.tar.gz: ${SZ} bytes"

        if [ "$SZ" -gt 104857600 ]; then
          # Show what to fix rather than just refusing. Without this the consumer
          # is told to "add excludes" with no idea which files are the problem.
          echo "::error::Source archive ${SZ} bytes exceeds the 100 MB server cap."
          echo "Largest members still in the archive:"
          tr '\0' '\n' < /tmp/source_members.z | sed 's|^\./||' | while IFS= read -r f; do
            [ -f "$f" ] && printf '%12s  %s\n' "$(_size "$f")" "$f"
          done | sort -rn | head -25
          echo "Set the 'source-excludes' input to drop these, or lower 'max-file-bytes' (currently ${MAX_FILE_BYTES})."
          exit 1
        fi

        if [ "$SZ" -gt 83886080 ]; then
          echo "::warning::Source archive is ${SZ} bytes — over 80% of the 100 MB cap. Consider trimming large assets before it starts failing."
        fi

    - name: Submit diff to compliance API
      if: steps.diff.outputs.skip != 'true'
      shell: bash
      env:
        COMPLIANCE_API_KEY: ${{ inputs.api-key }}
        FRAMEWORKS: ${{ inputs.frameworks }}
        # PR metadata — sent as multipart form fields (server reads these);
        # values injected via env so PR titles with quotes can't break the shell.
        REPO_ID: ${{ github.repository }}
        BASE_SHA: ${{ env.MERGE_BASE }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      run: |
        COMMIT_MESSAGES=$(cat /tmp/commit_messages.json)

        # Include README only if it exists in the repo root
        if [ -f README.md ]; then
          README_ARG=(-F "readme=@README.md;type=text/plain")
        else
          README_ARG=()
        fi

        # Include frameworks only if the input was provided
        if [ -n "$FRAMEWORKS" ]; then
          FRAMEWORKS_ARG=(-F "frameworks=$FRAMEWORKS")
        else
          FRAMEWORKS_ARG=()
        fi

        # Submit is rate-limited per consumer just like the status endpoint, so it
        # has to honour 429/retry_after_seconds too — otherwise a rate-limited
        # submit just falls through to the missing-job_id error below.
        SUBMIT_MAX_ATTEMPTS=5
        SUBMIT_ATTEMPT=0
        while :; do
          SUBMIT_ATTEMPT=$((SUBMIT_ATTEMPT + 1))

          HTTP_CODE=$(curl -sS -X POST \
            -H "Authorization: Bearer $COMPLIANCE_API_KEY" \
            -F "diff=@/tmp/pr.diff;type=text/plain" \
            -F "source=@/tmp/source.tar.gz;type=application/gzip" \
            "${README_ARG[@]}" \
            -F "commit_messages=$COMMIT_MESSAGES" \
            "${FRAMEWORKS_ARG[@]}" \
            -F "repo_id=$REPO_ID" \
            -F "base_sha=$BASE_SHA" \
            -F "head_sha=$HEAD_SHA" \
            -F "pr_number=$PR_NUMBER" \
            -F "pr_title=$PR_TITLE" \
            -F "pr_author=$PR_AUTHOR" \
            --max-time 300 \
            -o /tmp/submit_response.json \
            -w "%{http_code}" \
            "https://llm.ubicomply.ai/sast/api/v1/compliance/pr-check/")

          echo "Submit attempt $SUBMIT_ATTEMPT - HTTP: $HTTP_CODE"
          if [ "$HTTP_CODE" != "429" ]; then
            break
          fi

          if [ "$SUBMIT_ATTEMPT" -ge "$SUBMIT_MAX_ATTEMPTS" ]; then
            echo "::error::Submit rate-limited (HTTP 429) after ${SUBMIT_ATTEMPT} attempts."
            cat /tmp/submit_response.json
            exit 1
          fi

          # A gateway-level 429 has no JSON body, so this parse must never abort
          # the step; fall back to 60s and cap the server-supplied value.
          RETRY_AFTER=$(jq -r '.retry_after_seconds // empty' /tmp/submit_response.json 2>/dev/null || true)
          case "$RETRY_AFTER" in
            ''|*[!0-9]*) RETRY_AFTER=60 ;;
          esac
          if [ "$RETRY_AFTER" -gt 300 ]; then
            RETRY_AFTER=300
          fi
          echo "Rate limited on submit. Waiting ${RETRY_AFTER}s before retrying..."
          sleep "$RETRY_AFTER"
        done

        JOB_ID=$(jq -r '.job_id // empty' /tmp/submit_response.json 2>/dev/null || true)
        if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "null" ]; then
          echo "::error::Submit did not return a job_id (HTTP ${HTTP_CODE})"
          cat /tmp/submit_response.json
          exit 1
        fi
        echo "$JOB_ID" > /tmp/job_id.txt
        echo "Submitted job: $JOB_ID"

    - name: Poll for result
      if: steps.diff.outputs.skip != 'true'
      shell: bash
      env:
        COMPLIANCE_API_KEY: ${{ inputs.api-key }}
        POLL_INTERVAL_SECONDS: ${{ inputs.poll-interval }}
        POLL_TIMEOUT_SECONDS: ${{ inputs.poll-timeout }}
      run: |
        JOB_ID=$(cat /tmp/job_id.txt)

        DEADLINE=$(( $(date +%s) + POLL_TIMEOUT_SECONDS ))
        ATTEMPT=0
        while :; do
          ATTEMPT=$((ATTEMPT + 1))
          if [ "$(date +%s)" -ge "$DEADLINE" ]; then
            echo "::error::Polling timed out after ${POLL_TIMEOUT_SECONDS}s"
            exit 1
          fi

          HTTP_CODE=$(curl -sS \
            -H "Authorization: Bearer $COMPLIANCE_API_KEY" \
            --max-time 30 \
            -o /tmp/poll_response.json \
            -w "%{http_code}" \
            "https://llm.ubicomply.ai/sast/api/v1/compliance/pr-check/jobs/${JOB_ID}")

          echo "Attempt $ATTEMPT - HTTP: $HTTP_CODE"

          # Handle 429 rate limit — honour Retry-After from response body.
          # A gateway-level 429 has no JSON body, so this parse must never abort
          # the step; fall back to 60s and cap the server-supplied value.
          if [ "$HTTP_CODE" = "429" ]; then
            RETRY_AFTER=$(jq -r '.retry_after_seconds // empty' /tmp/poll_response.json 2>/dev/null || true)
            case "$RETRY_AFTER" in
              ''|*[!0-9]*) RETRY_AFTER=60 ;;
            esac
            if [ "$RETRY_AFTER" -gt 300 ]; then
              RETRY_AFTER=300
            fi
            echo "Rate limited. Waiting ${RETRY_AFTER}s before retrying..."
            sleep "$RETRY_AFTER"
            continue
          fi

          STATUS=$(jq -r '.status // "unknown"' /tmp/poll_response.json)
          echo "status: $STATUS"

          case "$STATUS" in
            success)
              jq -r '.result' /tmp/poll_response.json > /tmp/api_response.md
              jq -r '.overall_status // "?"' /tmp/poll_response.json > /tmp/overall_status.txt
              echo "Got result ($(wc -c < /tmp/api_response.md) bytes); verdict: $(cat /tmp/overall_status.txt)"
              break
              ;;
            failed)
              ERR=$(jq -r '.error // "unknown error"' /tmp/poll_response.json)
              printf '## 🔒 Compliance Review\n\n❌ Analysis failed.\n\n```\n%s\n```\n' "$ERR" \
                > /tmp/api_response.md
              echo "blocked" > /tmp/overall_status.txt
              break
              ;;
            pending|running|queued)
              sleep "$POLL_INTERVAL_SECONDS"
              ;;
            unknown)
              # Handle job_not_found or any response missing a status field
              ERR=$(jq -r '.error // "unknown error"' /tmp/poll_response.json)
              if [ "$ERR" = "job_not_found" ]; then
                echo "::error::Job ${JOB_ID} not found on server."
                exit 1
              fi
              echo "::error::Unexpected response: $ERR"
              cat /tmp/poll_response.json
              exit 1
              ;;
            *)
              echo "::error::Unexpected status: $STATUS"
              cat /tmp/poll_response.json
              exit 1
              ;;
          esac
        done

    - name: Post comment on PR
      if: steps.diff.outputs.skip != 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        BODY=$(jq -Rs '{body: .}' < /tmp/api_response.md)
        curl -sS -X POST \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          -d "$BODY" \
          "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments"

    - name: Enforce compliance verdict
      if: steps.diff.outputs.skip != 'true'
      shell: bash
      run: |
        # Fail the check on a non-passing verdict so it blocks merge (with
        # branch protection). FAST is deprecated, so 'blocked' (no source /
        # codebase reuse, or the sweep failed) fails the check too.
        V=$(cat /tmp/overall_status.txt 2>/dev/null || echo "?")
        echo "Compliance verdict: $V"
        case "$V" in
          fail|blocked)
            echo "::error::Compliance check did not pass (verdict: $V)"
            exit 1 ;;
          clean|warn) echo "Verdict acceptable." ;;
          *) echo "::warning::Unknown verdict '$V' — not failing the check." ;;
        esac

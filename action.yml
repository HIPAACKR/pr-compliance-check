name: 'Compliance Check'
description: 'Submits PR diff to a compliance API and posts the analysis as a PR comment.'
author: 'UbiComply'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  api-key:
    description: 'Compliance API key'
    required: true
  github-token:
    description: 'GitHub token for posting PR comments'
    required: true
    default: ${{ github.token }}
  frameworks:
    description: 'JSON array of compliance frameworks to map findings against, e.g. ["hipaa","cmmc"]. Omit for CWE-only output.'
    required: false
    default: ''
  poll-interval:
    description: 'Seconds between status polls'
    required: false
    default: '5'
  source-excludes:
    description: 'Extra tar exclude globs for the uploaded source archive, comma- or newline-separated (e.g. "public/images/*,docs/*"). Use when a repo trips the 100 MB server cap on assets the scanner does not need. Excluding paths hides them from your own compliance scan, so exclude assets, not code. .env, .env.*, *.pem, *.key, *.p12, *.pfx, *.jks and *.keystore are always left out.'
    required: false
    default: ''
  max-file-bytes:
    description: 'Any single tracked file larger than this is left out of the source archive (default 2 MB). Oversized files are not analyzable source; the common case is a Figma-exported .svg carrying a base64 raster. Raise it if your repo has legitimately large source files. Lockfiles (package-lock.json, yarn.lock, pnpm-lock.yaml, Gemfile.lock, composer.lock, poetry.lock, Pipfile.lock, Cargo.lock, go.sum) are exempt.'
    required: false
    default: '2097152'
  publish-check-run:
    description: 'Also publish the result as a named "Compliance Check" check with inline annotations on the changed lines. Needs `checks: write` in the workflow permissions; without it the step only warns. Set to false to keep just the PR comment.'
    required: false
    default: 'true'
  poll-timeout:
    description: 'Max seconds to wait for a result. Sent to the server as client_timeout, so it can expire a job nobody will read. Large or security-sensitive PRs run a deeper agentic sweep that can run well over an hour under shared-GPU contention. NOTE: the server job TTL (COMPLIANCE_PR_JOB_TTL_SECONDS, default 3h15m and never lower; the server raises any smaller value to that floor) must be >= this value, or a job running past the TTL returns job_not_found mid-poll instead of finishing. Raising poll-timeout above 3h15m needs the server TTL raised to match. The default drops to 5400 once the server run budget is live.'
    required: false
    default: '10800'
  max-queue:
    description: 'Max seconds the job may wait in the server queue before it starts. Sent to the server as max_queue; the server clamps it. Empty means poll-timeout minus 3600 (7200 with the default poll-timeout).'
    required: false
    default: ''
  enforce:
    description: 'How the result decides the job. hard: fail unless the verdict is clean or warn, and also when the server says the run was not fully assessed. verdict-only: fail on the verdict only; the named check shows neutral instead of failure. advisory: never fail; warnings only, and the named check shows neutral. Give-ups (no verdict from the server) count as a blocked verdict.'
    required: false
    default: 'hard'
  upload-report:
    description: 'Upload the full report (and the raw result) as a workflow artifact. A PR comment over 60,000 characters is cut and points to it.'
    required: false
    default: 'true'
  previous-comments:
    description: 'keep (default) leaves earlier compliance comments as they are. minimize hides the earlier comments this job posted on the PR as outdated.'
    required: false
    default: 'keep'

outputs:
  outcome:
    description: 'What happened to the run: analysed, a blocked reason, a server error_code, an action give-up, or skipped. See the README outcome table.'
    value: ${{ steps.record.outputs.outcome || steps.diff.outputs.outcome }}
  verdict:
    description: 'clean, warn, fail or blocked. Empty when the run was skipped.'
    value: ${{ steps.record.outputs.verdict }}
  assessment:
    description: 'complete, partial, not_assessed or nothing_to_assess when the server sends it; empty otherwise.'
    value: ${{ steps.record.outputs.assessment }}
  job-id:
    description: 'The compliance API job id, once submitted.'
    value: ${{ steps.record.outputs.job-id }}
  report-artifact:
    description: 'Name of the workflow artifact with the full report.'
    value: ${{ steps.comment.outputs.artifact-name }}

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Generate diff and collect commit messages
      id: diff
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        . "${{ github.action_path }}/scripts/lib.sh"
        # Start clean. Self-hosted runners keep /tmp between jobs, and a stale
        # outcome.txt would make every later step skip.
        cc_reset_state

        MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
        # Persist the merge-base so the submit step can send it as base_sha —
        # the server keys baseline lookup + delta on (repo_id, base_sha).
        echo "MERGE_BASE=$MERGE_BASE" >> "$GITHUB_ENV"
        git diff "$MERGE_BASE" "$HEAD_SHA" > /tmp/pr.diff

        DIFF_SIZE=$(wc -c < /tmp/pr.diff | tr -d " ")
        echo "Diff size: ${DIFF_SIZE} bytes"

        # Guard: skip analysis when the PR changes no substantive content.
        # An empty /tmp/pr.diff is the wrong test on its own — a whitespace-only
        # PR still produces a non-empty diff. Count changed lines with whitespace
        # and blank-line changes ignored instead. numstat prints "-" for binary
        # files, which always count as substantive; pure renames and mode changes
        # score 0 and are treated as metadata-only.
        CHANGED_LINES=$(git diff --ignore-all-space --ignore-blank-lines --numstat \
          "$MERGE_BASE" "$HEAD_SHA" \
          | awk -F'\t' '{ if ($1 == "-" || $2 == "-") { n += 1 } else { n += $1 + $2 } } END { print n + 0 }')
        echo "Substantive changed lines: ${CHANGED_LINES}"

        # Every later step is gated on this output. Exiting 0 here only ends this
        # step — without the gate the rest of the action runs on inputs that were
        # never produced and the check goes red instead of skipping cleanly.
        if [ "$CHANGED_LINES" -eq 0 ]; then
          echo "::notice::No substantive changes (whitespace-only, metadata-only, or net-empty PR) — skipping compliance analysis."
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "outcome=skipped" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "skip=false" >> "$GITHUB_OUTPUT"

        # Guard: the server refuses diffs over 5 MB. Record a give-up (outcome,
        # comment, blocked verdict) instead of a bare error; the enforce step
        # decides the job.
        if [ "$DIFF_SIZE" -gt 5242880 ]; then
          cc_give_up diff_too_large "The diff is ${DIFF_SIZE} bytes, over the 5 MB server limit."
          exit 0
        fi

        # Collect subject + body per commit, NUL-delimited to safely handle newlines.
        # Each element in the JSON array is one full commit message (subject + blank line + body),
        # with trailing whitespace trimmed. Commits with no body produce subject-only strings.
        # Server caps at 20 entries in the prompt; rest are collapsed server-side.
        git log "$MERGE_BASE".."$HEAD_SHA" --format="%s%n%n%b%x00" | \
          awk 'BEGIN{RS="\0"} {gsub(/[[:space:]]+$/, ""); if (length > 0) print}' | \
          jq -R . | jq -s . > /tmp/commit_messages.json
        echo "Commit messages: $(jq -c . /tmp/commit_messages.json)"

    # GitHub does not pass secrets to pull_request workflows from forks. An
    # empty key becomes outcome not_run_fork (or missing_api_key), a comment
    # and a blocked verdict, never a silent pass.
    - name: Check the API key
      if: steps.diff.outputs.skip != 'true'
      shell: bash
      env:
        COMPLIANCE_API_KEY: ${{ inputs.api-key }}
        IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: bash "${{ github.action_path }}/scripts/check-key.sh"

    - name: Package source for the agentic sweep
      if: steps.diff.outputs.skip != 'true'
      shell: bash
      env:
        SOURCE_EXCLUDES: ${{ inputs.source-excludes }}
        MAX_FILE_BYTES: ${{ inputs.max-file-bytes }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: cd "$GITHUB_WORKSPACE" && bash "${{ github.action_path }}/scripts/package-source.sh"

    - name: Submit diff to compliance API
      if: steps.diff.outputs.skip != 'true'
      shell: bash
      env:
        COMPLIANCE_API_KEY: ${{ inputs.api-key }}
        # Set here so a workflow-level env var cannot redirect the key.
        COMPLIANCE_API_URL: https://llm.ubicomply.ai/sast/api/v1/compliance/pr-check
        FRAMEWORKS: ${{ inputs.frameworks }}
        # PR metadata — sent as multipart form fields (server reads these);
        # values injected via env so PR titles with quotes can't break the shell.
        REPO_ID: ${{ github.repository }}
        BASE_SHA: ${{ env.MERGE_BASE }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        POLL_TIMEOUT_SECONDS: ${{ inputs.poll-timeout }}
        MAX_QUEUE_SECONDS: ${{ inputs.max-queue }}
      run: cd "$GITHUB_WORKSPACE" && bash "${{ github.action_path }}/scripts/submit.sh"

    - name: Poll for result
      if: steps.diff.outputs.skip != 'true'
      shell: bash
      env:
        COMPLIANCE_API_KEY: ${{ inputs.api-key }}
        COMPLIANCE_API_URL: https://llm.ubicomply.ai/sast/api/v1/compliance/pr-check
        POLL_INTERVAL_SECONDS: ${{ inputs.poll-interval }}
        POLL_TIMEOUT_SECONDS: ${{ inputs.poll-timeout }}
        MAX_QUEUE_SECONDS: ${{ inputs.max-queue }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: bash "${{ github.action_path }}/scripts/poll-job.sh"

    - name: Post comment on PR
      id: comment
      if: steps.diff.outputs.skip != 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        FRAMEWORKS: ${{ inputs.frameworks }}
        UPLOAD_REPORT: ${{ inputs.upload-report }}
        PREVIOUS_COMMENTS: ${{ inputs.previous-comments }}
      # Never decides the job: every failure is a warning and it exits 0.
      run: bash "${{ github.action_path }}/scripts/post-comment.sh"

    - name: Upload the full report
      if: steps.diff.outputs.skip != 'true' && inputs.upload-report == 'true' && steps.comment.outputs.artifact-name != ''
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.comment.outputs.artifact-name }}
        path: /tmp/compliance-report
        if-no-files-found: ignore

    - name: Publish check run and annotations
      if: steps.diff.outputs.skip != 'true' && inputs.publish-check-run == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        ENFORCE: ${{ inputs.enforce }}
      # Never decides the job: every failure is a warning and the script
      # exits 0. The enforce step decides the job.
      run: bash "${{ github.action_path }}/scripts/publish-check-run.sh" /tmp/check_run.json /tmp/annotations.txt

    # A step above failed before the run had an outcome (git, checkout, disk).
    # Say so on the PR instead of leaving only a red job.
    - name: Report an action error
      id: crash
      if: failure() && steps.diff.outputs.skip != 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        FRAMEWORKS: ${{ inputs.frameworks }}
        UPLOAD_REPORT: 'false'
      run: |
        . "${{ github.action_path }}/scripts/lib.sh"
        if cc_decided; then
          exit 0
        fi
        cc_give_up action_error "A step of the action failed before the run had an outcome. See the job log."
        bash "${{ github.action_path }}/scripts/post-comment.sh"

    - name: Record the outcome
      id: record
      if: always() && steps.diff.outputs.skip != 'true'
      shell: bash
      env:
        ENFORCE: ${{ inputs.enforce }}
      run: |
        val() {
          if [ -s "/tmp/$1" ]; then head -n1 "/tmp/$1" | tr -cd 'A-Za-z0-9._-' | cut -c1-128; fi
        }
        OUTCOME=$(val outcome.txt)
        VERDICT=$(val overall_status.txt)
        ASSESSMENT=$(val assessment.txt)
        JOB=$(val job_id.txt)
        {
          echo "outcome=$OUTCOME"
          echo "verdict=$VERDICT"
          echo "assessment=$ASSESSMENT"
          echo "job-id=$JOB"
        } >> "$GITHUB_OUTPUT"
        MODE=$(printf '%s' "${ENFORCE:-hard}" | tr -cd 'A-Za-z0-9._-' | cut -c1-20)
        {
          echo "### Compliance Check"
          echo
          echo "| Outcome | Verdict | Assessment | Enforce | Job |"
          echo "|---|---|---|---|---|"
          echo "| ${OUTCOME:--} | ${VERDICT:--} | ${ASSESSMENT:--} | ${MODE:-hard} | ${JOB:--} |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Enforce compliance verdict
      if: steps.diff.outputs.skip != 'true'
      shell: bash
      env:
        ENFORCE: ${{ inputs.enforce }}
      # hard (default) fails closed like v1.6: only clean and warn pass. fail,
      # blocked (the analysis could not run, or a give-up), a missing verdict
      # and an unknown one all fail the check, so it blocks the merge with
      # branch protection. hard also fails a run the server did not fully
      # assess. verdict-only ignores the assessment; advisory only warns.
      run: bash "${{ github.action_path }}/scripts/enforce-verdict.sh" /tmp/overall_status.txt /tmp/outcome.txt /tmp/assessment.txt
